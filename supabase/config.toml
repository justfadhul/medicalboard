project_id = "umb-case-system"

[db]
major_version = 15
port = 54422
shadow_port = 54420

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Accounts are created only by admin invitation.
enable_signup = false
jwt_expiry = 3600

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "15MiB"

[edge_runtime]
enabled = true

[functions.sms-dispatch]
verify_jwt = false

[functions.ai-read]
verify_jwt = true
