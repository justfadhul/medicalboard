name: CI
on:
  push:
  pull_request:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client >/dev/null
      - name: Migrations, RLS tests for every role, workflow tests
        run: bash supabase/tests/run-local.sh
        env: { PGURL: "postgres://postgres:postgres@localhost:5432/postgres" }

  e2e:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 3.1.0 }
      - run: npm ci
      - run: sudo systemctl stop postgresql || true
      - name: Start local Supabase (applies migrations and seed)
        run: |
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,inbucket,vector,logflare,supavisor && exit 0
            echo "Start attempt $i failed; retrying"; supabase stop --no-backup || true; sleep 10
          done
          exit 1
      - name: Export Supabase keys
        run: |
          supabase status -o env > .sb.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' .sb.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .sb.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .sb.env | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env: { NEXT_PUBLIC_APP_URL: "http://localhost:3000", NEXT_PUBLIC_SCAN_BRIDGE_URL: "http://localhost:7317" }
      - name: End-to-end (fake camera stream, mock SMS)
        run: npm run e2e
        env: { NEXT_PUBLIC_APP_URL: "http://localhost:3000", SMS_PROVIDER: mock, VERIFY_CAPTCHA_OPTIONAL: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "playwright-report\ntest-results", retention-days: 7 }
